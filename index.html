<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Lieux</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lieux">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Carte de tes photos"></div>

<!-- Top bar -->
<header class="topbar glass" id="topbar" hidden>
  <div class="titles">
    <h1 id="title">Lieux</h1>
    <p id="summary">—</p>
  </div>
  <button class="icon-btn" id="searchBtn" aria-label="Rechercher">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
</header>

<!-- Right-side controls -->
<div class="controls glass" id="controls" hidden>
  <button id="styleBtn" aria-label="Style de carte">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
  </button>
  <button id="albumsBtn" aria-label="Albums">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="17" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M6.5 3.8h11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M6 17l4-4.5 3 3 2-2 3 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
  </button>
  <button id="fitBtn" aria-label="Voir toutes les photos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<!-- Map style popover -->
<div class="popover glass" id="stylePop" hidden role="dialog" aria-label="Style de carte">
  <p class="pop-title">Carte</p>
  <div class="seg" id="styleSeg">
    <button data-style="auto">Auto</button>
    <button data-style="light">Plan</button>
    <button data-style="dark">Sombre</button>
    <button data-style="satellite">Satellite</button>
  </div>
</div>

<!-- Active filter chip (album / search) -->
<div class="chip glass" id="filterChip" hidden>
  <span id="filterLabel"></span>
  <button id="filterClear" aria-label="Retirer le filtre">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
</div>

<nav class="years glass" id="years" hidden aria-label="Filtrer par année"></nav>

<div class="status glass" id="status" hidden><span class="spinner" aria-hidden="true"></span><span id="statusText"></span></div>

<!-- Search -->
<section class="search" id="search" hidden>
  <div class="search-bar">
    <label class="search-field glass">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="Lieu, ou ce qu'il y a sur la photo" autocomplete="off" enterkeyhint="search">
    </label>
    <button class="text-btn" id="searchCancel">Annuler</button>
  </div>
  <div class="results glass" id="results" hidden></div>
</section>

<!-- Sign-in -->
<section class="signin" id="signin" hidden>
  <div class="signin-card">
    <img src="icons/icon-192.png" alt="" width="84" height="84">
    <h2>Lieux</h2>
    <p>Tes photos OneDrive, sur la carte.</p>
    <button class="primary" id="signinBtn">Se connecter avec Microsoft</button>
    <p class="fine">Seul ton compte Microsoft donne accès à tes photos.</p>
  </div>
</section>

<!-- Photo grid sheet -->
<section class="sheet glass" id="sheet" aria-hidden="true">
  <div class="grabber"></div>
  <div class="sheet-head">
    <div class="sheet-titles">
      <h2 id="sheetTitle">—</h2>
      <p id="sheetSub"></p>
    </div>
    <button class="text-btn" id="selectBtn">Sélectionner</button>
    <button class="icon-btn close" id="sheetClose" aria-label="Fermer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="selbar" id="selbar" hidden>
    <span id="selCount">0 sélectionnée</span>
    <button class="icon-btn" id="selLike" aria-label="Ajouter aux favoris">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <button class="pill-btn" id="selAlbum">Ajouter à un album</button>
  </div>
</section>

<!-- Viewer -->
<section class="viewer" id="viewer" aria-hidden="true">
  <div class="viewer-top">
    <button class="icon-btn" id="viewerClose" aria-label="Fermer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="viewer-meta"><strong id="viewerDate"></strong><span id="viewerPlace"></span></div>
    <span class="icon-spacer"></span>
  </div>
  <div class="viewer-stage" id="viewerStage">
    <img id="viewerImg" alt="">
    <video id="viewerVideo" playsinline controls preload="none" hidden></video>
    <button class="play" id="viewerPlay" hidden aria-label="Lire la vidéo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="viewer-count" id="viewerCount"></div>
  <div class="viewer-actions">
    <button class="icon-btn" id="viewerLike" aria-label="J'aime" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="viewerAlbum" aria-label="Ajouter à un album">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.5 9v11a1 1 0 0 1-1 1h-11M10 9v6M7 12h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
    <a class="icon-btn" id="viewerOpen" target="_blank" rel="noopener" aria-label="Ouvrir dans OneDrive">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</section>

<!-- Generic modal sheet (albums list, album picker, permission) -->
<section class="modal" id="modal" aria-hidden="true">
  <div class="modal-card glass" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn close" id="modalClose" aria-label="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</section>

<div class="toast glass" id="toast" role="status" hidden></div>

<script src="vendor/msal-browser.min.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/supercluster.min.js"></script>
<script src="mapstyle.js"></script>
<script src="app.js"></script>
</body>
</html>
